<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运维工作台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/ssh.css">
  <script src="/vendor/xterm.js" defer></script>
  <script src="/vendor/fit.js" defer></script>
  <script src="/terminal-ui.js" defer></script>
  <script src="/ssh.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="bar-inner">
      <a href="/" class="brand"><span class="host-mark" aria-hidden="true">&gt;_</span>运维工作台</a>
      <nav class="navigation" id="workbench-navigation" aria-label="工作台" hidden>
        <button data-view="terminal" aria-current="page">终端</button>
        <button data-view="library">快捷指令与流程</button>
        <button data-view="servers">服务器</button>
      </nav>
      <span class="machine" id="head-status"></span>
    </div>
  </header>

  <main id="login" class="login" hidden>
    <h1>登录工作台</h1><form id="login-form">
      <label for="username">账号</label><input id="username" name="username" autocomplete="username" value="admin" required>
      <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden></p><button class="primary" type="submit">登录</button>
    </form>
  </main>

  <main class="workspace" id="workspace" hidden>
    <p class="error" id="notice" role="alert" hidden></p>

    <section id="view-terminal" class="view">
      <div class="page-heading"><div><h1>终端工作区</h1><p>拖动窗口右下角调节大小。</p></div></div>
      <div class="terminal-toolbar">
        <form id="attach-form" class="connect-line"><label for="terminal-connection">SSH 连接</label><select id="terminal-connection"></select><button class="primary" type="submit">添加窗口</button></form>
        <div class="actions"><button type="button" id="open-local-terminal" hidden>本机终端</button><button type="button" id="toggle-split" aria-pressed="false" disabled>平铺窗口</button></div>
      </div>
      <p id="terminal-empty" hidden>先在「服务器」添加一个 SSH 连接。</p>
      <div class="terminal-desk">
        <div class="terminal-stack">
          <div id="terminal-tabs" class="terminal-tabs" aria-label="已打开终端" role="group"></div>
          <div id="terminal-main" class="terminal-panes"></div>
          <p id="no-terminal-windows" class="terminal-placeholder">添加窗口后，在这里显示 SSH 终端。</p>
        </div>
        <aside class="terminal-sidebar" id="terminal-sidebar" aria-label="快捷操作">
          <div class="sidebar-heading">
            <div><h2 id="sidebar-title">当前服务器</h2><p class="sidebar-endpoint" id="sidebar-endpoint"></p></div>
            <button type="button" id="sidebar-hide" class="sidebar-hide">收起</button>
          </div>
          <p id="sidebar-target" class="sidebar-target" hidden></p>
          <div class="sidebar-modes" aria-label="当前服务器面板" role="group">
            <button type="button" data-side="flows" aria-pressed="true">自动化流程</button>
            <button type="button" data-side="commands" aria-pressed="false">快捷指令</button>
            <button type="button" data-side="history" aria-pressed="false">执行记录</button>
          </div>
          <p id="sidebar-notice" class="error" role="alert" hidden></p>
          <p id="sidebar-empty" class="sidebar-empty" hidden></p><ul id="sidebar-items" class="sidebar-items"></ul>
        </aside>
      </div>
      <button type="button" id="sidebar-toggle" class="primary sidebar-toggle" aria-controls="terminal-sidebar" aria-expanded="false">快捷操作</button>
    </section>

    <section id="view-library" class="view" hidden>
      <div class="page-heading"><h1>快捷指令与流程</h1><div class="actions"><button id="new-command">新建快捷指令</button><button class="primary" id="new-flow">新建自动化流程</button></div></div>
      <div class="connect-line"><label for="library-server">服务器</label><select id="library-server"></select></div>
      <div class="library-lists"><section><h2>流程</h2><ul class="items" id="flow-list"></ul></section><section><h2>快捷指令</h2><ul class="items" id="command-list"></ul></section></div>
    </section>

    <section id="view-servers" class="view" hidden>
      <div class="page-heading"><div><h1>服务器</h1><p>同一主机和 SSH 端口下，可以保存多个登录账号。</p></div><button class="primary" id="add-server">添加 SSH 连接</button></div>
      <p id="servers-empty" hidden>还没有连接。添加第一条 SSH 连接后就可以打开终端。</p>
      <div id="server-list" class="server-groups"></div>
    </section>
  </main>

  <dialog id="editor" class="editor-dialog"><form id="editor-form">
    <div class="dialog-title"><h2 id="editor-title"></h2><button type="button" class="icon-button" id="editor-close" aria-label="关闭">×</button></div>
    <label for="edit-name">名称</label><input id="edit-name" maxlength="60" required>
    <div id="server-fields" class="form-row" hidden>
      <label>主机<input id="edit-host" placeholder="IP 地址或域名"></label><label>端口<input id="edit-port" type="number" min="1" max="65535" value="22"></label><label>SSH 登录用户<input id="edit-login-user"></label>
    </div>
    <div id="ssh-password-fields" hidden>
      <label for="edit-ssh-password">SSH 登录密码（选填）</label>
      <div class="actions secret-line"><input id="edit-ssh-password" type="password" autocomplete="off"><button id="toggle-ssh-password" type="button">显示</button><button id="clear-ssh-password" type="button" hidden>清除密码</button></div>
    </div>
    <div class="form-row" id="context-fields"><label>SSH 连接<select id="edit-connection"></select></label><label>类型（选填）<input id="edit-type" list="types" placeholder="如更新、检查、排查" maxlength="24"></label></div>
    <datalist id="types"><option value="更新"></option><option value="检查"></option><option value="排查"></option><option value="恢复"></option></datalist>
    <div id="command-fields" hidden>
      <div class="form-row"><label>执行用户<input id="edit-user" placeholder="例如 appuser"></label><label>工作目录<input id="edit-directory" placeholder="/srv/myapp"></label></div>
      <label for="edit-script">命令</label><textarea id="edit-script" rows="5" spellcheck="false" placeholder="输入要在远程终端执行的命令"></textarea>
      <button type="button" id="mark-parameter">把选中的内容设为参数</button>
      <div id="parameter-fields" class="form-row" hidden><label>参数名<input id="edit-parameter-name" placeholder="buildUrl"></label><label>运行时的提示<input id="edit-parameter-label" placeholder="构建包链接"></label><button type="button" id="insert-parameter">设为参数</button></div>
      <div id="parameter-labels"></div>
      <div class="form-row">
        <label>自定义提示（选填）<input id="edit-followup-prompt" maxlength="200" placeholder="例如 Continue? [y/N]"></label>
        <label>匹配提示时<select id="edit-followup-mode"><option value="auto">自动输入</option><option value="manual">提示我手动输入</option></select></label>
      </div>
      <label for="edit-secret">下一步输入（选填）</label><div class="actions secret-line"><input id="edit-secret" type="password" autocomplete="off"><button id="toggle-secret" type="button">显示</button><button id="clear-secret" type="button" hidden>清除</button></div>
      <p id="followup-hint" class="field-hint" hidden>自动输入的文字可能出现在终端输出里。</p>
    </div>
    <div id="flow-fields" hidden><label for="step-choice">按顺序加入快捷指令</label><div class="actions"><select id="step-choice"></select><button id="add-step" type="button">添加</button></div><p class="field-hint">同一个包的步骤填同一分组名。留空的步骤为公共步骤。</p><ol id="step-list"></ol><datalist id="flow-groups"></datalist></div>
    <p class="error" id="editor-error" role="alert" hidden></p><div class="actions dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="primary" type="submit" id="save">保存</button></div>
  </form></dialog>

  <dialog id="parameters" class="editor-dialog"><form id="parameters-form"><h2 id="parameters-title"></h2><p id="parameters-terminal"></p><fieldset id="run-groups" hidden><legend>选择本次要运行的分组</legend><div id="run-group-options"></div></fieldset><div id="parameters-inputs"></div><p class="error" id="parameters-error" role="alert" hidden></p><div class="actions dialog-actions"><button id="cancel-run" type="button">取消</button><button class="primary" type="submit">开始执行</button></div></form></dialog>

  <dialog id="delete-dialog" class="editor-dialog"><form id="delete-form"><h2 id="delete-title"></h2><p id="delete-message"></p><ul id="delete-items"></ul><p id="delete-error" class="error" role="alert" hidden></p><div class="actions dialog-actions"><button id="cancel-delete" type="button">取消</button><button id="confirm-delete" type="submit" class="danger-fill">确认删除</button></div></form></dialog>

  <template id="terminal-template"><article class="terminal-card">
    <div class="terminal-heading">
      <div class="terminal-identity"><div class="terminal-label"><span class="terminal-index" aria-hidden="true"></span><strong class="term-name"></strong></div><p class="term-context">正在连接…</p></div>
      <div class="actions"><span class="selected-pane" hidden>当前</span><button type="button" class="focus-pane">选中</button><button type="button" class="close-pane" aria-label="关闭窗口" title="关闭窗口">×</button></div>
    </div>
    <div class="run-info" hidden><p class="run-message" role="status"></p><ol class="run-steps"></ol>
      <div class="actions run-controls"><button data-action="takeover">接管终端</button><button data-action="retry">重试本步</button><button data-action="next">本步已完成，继续</button><button data-action="end">结束流程</button></div>
    </div>
    <p class="terminal-input-notice" role="status" hidden></p>
    <p class="error terminal-error" hidden></p><div class="xterm-host"><div class="xterm-mount" aria-label="SSH 终端"></div></div>
    <button type="button" class="resize-pane" aria-label="调整窗口宽高" title="拖动或用方向键调整，双击恢复默认"></button>
  </article></template>
</body>
</html>
